<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Haju</title>
    <style>
        /* Base Aesthetic - Dark & Elegant */
        body {
            background-color: #0a0a0a;
            color: #E8D399; /* Gold color */
            font-family: 'Playfair Display', Georgia, serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Scene Setup for Animation */
        .scene {
            position: absolute;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            text-align: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .active {
            opacity: 1;
            z-index: 10;
        }

        /* SCENE 1: Scrolling Months */
        .scroller-window {
            height: 200px;
            overflow: hidden;
            position: relative;
            width: 100%;
            /* Fades the top and bottom of the scrolling list */
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
        }

        .months-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Starts lower down to show earlier months */
            transform: translateY(140px); 
            transition: transform 2.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* The class added by JS to trigger the scroll */
        .months-wrapper.scroll-up {
            transform: translateY(-135px); /* Lands perfectly on November */
        }

        .month-item {
            font-size: 2.2rem;
            color: #444; /* Dim color for passing months */
            margin: 12px 0;
            font-weight: bold;
            letter-spacing: 2px;
            transition: color 0.8s, font-size 0.8s, text-shadow 0.8s;
        }

        .month-item.glow {
            color: #E8D399;
            font-size: 3rem;
            text-shadow: 0 0 15px rgba(232, 211, 153, 0.6);
        }

        .date-reveal {
            opacity: 0;
            font-size: 1.8rem;
            color: #fff;
            margin-top: 10px;
            letter-spacing: 4px;
            font-family: sans-serif;
            transition: opacity 1s ease-in-out;
        }

        .date-reveal.show {
            opacity: 1;
        }

        /* SCENE 2: Typography */
        h1 {
            font-size: 3.8rem;
            font-style: italic;
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 0 10px rgba(232, 211, 153, 0.3);
        }

        /* SCENE 3: Photo Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        .photo-box {
            border: 1px solid #E8D399;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #555;
            font-family: sans-serif;
            font-size: 0.8rem;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <!-- SCENE 1: Scrolling Months & Date -->
    <div id="scene1" class="scene active">
        <div class="scroller-window">
            <div class="months-wrapper" id="monthScroller">
                <div class="month-item">AUGUST</div>
                <div class="month-item">SEPTEMBER</div>
                <div class="month-item">OCTOBER</div>
                <div class="month-item" id="targetMonth">NOVEMBER</div>
                <div class="month-item">DECEMBER</div>
            </div>
        </div>
        <div class="date-reveal" id="dateText">06 / 11</div>
    </div>

    <!-- SCENE 2: The Main Wish -->
    <div id="scene2" class="scene">
        <h1>Happy<br>Birthday<br>Haju!</h1>
    </div>

    <!-- SCENE 3: The Photo Grid -->
    <div id="scene3" class="scene">
        <div class="grid">
            <!-- Add images later by replacing the background color with a background-image style. -->
            <div class="photo-box">Pic 1</div>
            <div class="photo-box">Pic 2</div>
            <div class="photo-box">Pic 3</div>
            <div class="photo-box">Pic 4</div>
        </div>
    </div>

    <!-- JavaScript to Sequence the Animation -->
    <script>
        // Timeline Logic
        window.onload = () => {
            
            // Step 1: Start scrolling the months after 500ms
            setTimeout(() => {
                document.getElementById('monthScroller').classList.add('scroll-up');
            }, 500);

            // Step 2: Highlight NOVEMBER and reveal 06/11 after the scroll finishes (2.5 seconds later)
            setTimeout(() => {
                document.getElementById('targetMonth').classList.add('glow');
                document.getElementById('dateText').classList.add('show');
            }, 2600);

            // Step 3: Transition to "Happy Birthday Haju!"
            setTimeout(() => {
                document.getElementById('scene1').classList.remove('active');
                document.getElementById('scene2').classList.add('active');
            }, 5500);

            // Step 4: Transition to the Images
            setTimeout(() => {
                document.getElementById('scene2').classList.remove('active');
                document.getElementById('scene3').classList.add('active');
            }, 8500);
        };
    </script>
</body>
</html>
